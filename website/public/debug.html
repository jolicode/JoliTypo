
<iframe id="output" width="100%" height="50%" frameBorder="0"></iframe>
<div id="monaco" style="height: 50%"></div>

<script type="module">
    import * as monaco from 'https://cdn.jsdelivr.net/npm/monaco-editor@0.39.0/+esm';
    import createPhp from "./build/php-web.mjs";

    async function main() {
        const output = document.getElementById('output')
        const php = await createPhp();

        console.log((await php.runCode('echo phpversion();')).stdout);

        const run = async () => {
            const {stdout} = await php.runFile('/app/src/index.php');
            output.contentWindow.document.body.innerHTML = stdout;
        }

        await run();

        const editor = monaco.editor.create(document.getElementById('monaco'));
        const model = editor.getModel();
        model.setLanguage('php');
        model.setValue(php.FS.readFile('/app/src/index.php', {encoding: 'utf8'}).toString());
        model.onDidChangeContent((v) => {
            php.FS.unlink('/app/src/index.php')
            php.FS.writeFile('/app/src/index.php', model.getValue());
            run();
        });
    }

    main();
</script>
